<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One Last Thing 💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #fff0f5;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
      background-image: url("bg.jpg");
  background-size: cover;
  background-position: center;
  }

  .video-wrapper {
    width: 90%;
    max-width: 720px;
    text-align: center;
  }

  video {
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    background: black;
  }

  .after-video {
    margin-top: 20px;
    display: none;
    animation: fadeIn 0.4s ease;
  }

  .after-video p {
    font-size: 18px;
    margin-bottom: 14px;
    color: #333;
  }

  .after-video button {
    background: #ff4d88;
    color: white;
    border: none;
    padding: 12px 26px;
    border-radius: 26px;
    font-size: 16px;
    cursor: pointer;
    margin: 0 6px;
  }

  .after-video button.secondary {
    background: #ddd;
    color: #333;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>

<div class="video-wrapper">

  <video id="confessionVideo" controls>
    <source src="will u_.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Appears after video ends -->
  <div id="afterVideo" class="after-video">
    <p>There’s one last thing I want to ask you.</p>

    <button class="secondary" onclick="replayVideo()">Replay ↺</button>
    <button onclick="goNext()">Continue 💗</button>
  </div>

</div>

<script>
  const video = document.getElementById("confessionVideo");
  const afterVideo = document.getElementById("afterVideo");

  // Show buttons when video ends
  video.addEventListener("ended", () => {
    afterVideo.style.display = "block";
  });

  // Replay video
  function replayVideo() {
    afterVideo.style.display = "none";
    video.currentTime = 0;
    video.play();
  }

  // Go to Valentine page (DIFFERENT FOLDER)
  function goNext() {
    window.location.href = "will-u-be-my/index.html";
  }
</script>

</body>
</html>
