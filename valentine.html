<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memories 💗</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #fff0f5;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
     background-image: url("bg.jpg");
  background-size: cover;
  background-position: center;
  }

  .slider {
    width: 360px;
    height: 520px;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
  }

  .slides {
    display: flex;
    height: 100%;
    transition: transform 0.4s ease;
  }

  .slide {
    min-width: 100%;
    height: 100%;
    position: relative;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ARROWS */
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 28px;
    background: rgba(0,0,0,0.4);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    z-index: 10;
  }

  .prev { left: 10px; }
  .next { right: 10px; }

  /* DOTS */
  .dots {
    position: absolute;
    bottom: 12px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 10;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: #ccc;
    border-radius: 50%;
  }

  .dot.active {
    background: #ff4d88;
  }

  /* LAST SLIDE BUTTON */
  .last-btn {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff4d88;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    display: none;
    z-index: 20;
  }

  .last-btn:hover {
    opacity: 0.9;
  }
</style>
</head>

<body>

<div class="slider">
  <div class="slides" id="slides">
    <div class="slide"><img src="catt0.png"></div>
    <div class="slide"><img src="suno.png"></div>
    <div class="slide"><img src="catt1.png"></div>
    <div class="slide"><img src="catt3.jpg"></div>
    <div class="slide"><img src="catt4.jpg"></div>

    <!-- LAST SLIDE -->
    <div class="slide">
      <img src="catt5.jpg">
      <button class="last-btn" id="lastBtn" onclick="goNext()">
        Click when you’re ready 💗
      </button>
    </div>
  </div>

  <div class="nav prev" onclick="prev()">‹</div>
  <div class="nav next" onclick="next()">›</div>

  <div class="dots" id="dots"></div>
</div>

<script>
let index = 0;
const slides = document.getElementById("slides");
const total = slides.children.length;
const dots = document.getElementById("dots");
const lastBtn = document.getElementById("lastBtn");

/* CREATE DOTS */
for (let i = 0; i < total; i++) {
  const d = document.createElement("div");
  d.className = "dot" + (i === 0 ? " active" : "");
  dots.appendChild(d);
}

function update() {
  slides.style.transform = `translateX(-${index * 100}%)`;

  [...dots.children].forEach((d, i) =>
    d.classList.toggle("active", i === index)
  );

  // Show button ONLY on last slide
  if (index === total - 1) {
    lastBtn.style.display = "block";
  } else {
    lastBtn.style.display = "none";
  }
}

function next() {
  if (index < total - 1) {
    index++;
    update();
  }
}

function prev() {
  if (index > 0) {
    index--;
    update();
  }
}

function goNext() {
  window.location.href = "video.html";
}
</script>

</body>
</html>
